name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit checks
        run: |
          python -m compileall 3_proof_of_concept 4_monitor_and_evaluate 2_data_strategy 6_deploy
      - name: Validate Terraform (EKS stack)
        run: |
          cd 6_deploy/infra/terraform && terraform fmt -check -recursive && terraform init -backend=false && terraform validate
      - name: Validate and test Terraform (AgentCore backends)
        # Mocked providers: no AWS credentials or calls
        run: |
          cd 6_deploy/infra/agentcore-backends
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test
