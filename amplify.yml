version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Preparing Specialty Bakeries & Pastry Cafés web app for Amplify deployment"
        - |
          if [ -f "6_deploy/web-app/cognito-config.json" ] && [ -s "6_deploy/web-app/cognito-config.json" ]; then
            echo "cognito-config.json found"
          else
            echo "WARNING: cognito-config.json is empty - update with real Cognito pool values before production use"
          fi
    build:
      commands:
        - echo "Static site - no build step required"
        - cp -r 6_deploy/web-app/. dist/
    postBuild:
      commands:
        - echo "Build complete"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
