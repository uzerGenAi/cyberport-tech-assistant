version: 0.2

# Validate stage: mirrors the retired .github/workflows/ci.yml. Pins Terraform 1.16.6 (the
# bundled image terraform is a different version) and runs the repo's own `make ci`
# (ci_checks.sh), which does python compileall + terraform fmt/validate/test on the stacks.

env:
  variables:
    TERRAFORM_VERSION: "1.16.6"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - |
        set -euo pipefail
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /usr/local/bin
        terraform version
      # make ci needs only python3 (stdlib compileall) and terraform, so no pip install here
  build:
    commands:
      - make ci
