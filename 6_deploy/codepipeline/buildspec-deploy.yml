version: 0.2

# Deploy stage: runs ./deploy.sh, the same resumable deploy people run by hand, so there is one
# deploy path to maintain. The pipeline's toggle variables choose which groups of steps run:
#   TOGGLE_PROVISION_BACKENDS     backends seed orders   (Aurora, DynamoDB, promotions API, data)
#   TOGGLE_SETUP_KNOWLEDGE_BASES  docs kbs               (documents bucket, vector store, 5 KBs)
#   TOGGLE_DEPLOY_AGENT           role guardrail app user harness test
#   TOGGLE_SMOKE                  frontend smoke test (also needs SMOKE_TEST_URL)
# The Validate stage already ran `make ci`, so the ci step is skipped here. The agent code is
# always shipped (FORCE=1); the demo password is never printed in CI logs (Secrets Manager only).

env:
  variables:
    TERRAFORM_VERSION: "1.16.6"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - |
        set -euo pipefail
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /usr/local/bin
        terraform version
      # deploy.sh runs from this virtual environment, exactly as on a laptop
      - python -m venv .venv
      - .venv/bin/pip install --upgrade pip
      - .venv/bin/pip install -r 6_deploy/agents/requirements-deploy.txt awscurl
  build:
    commands:
      - |
        set -euo pipefail
        aws sts get-caller-identity

        skip="ci"
        [ "${TOGGLE_PROVISION_BACKENDS}" = "true" ]    || skip="$skip backends seed orders"
        [ "${TOGGLE_SETUP_KNOWLEDGE_BASES}" = "true" ] || skip="$skip docs kbs"
        [ "${TOGGLE_DEPLOY_AGENT}" = "true" ]          || skip="$skip role guardrail app user harness test"
        echo "Skipping steps: $skip"

        YES=1 AUTO_APPROVE=1 FORCE=1 SKIP_STEPS="$skip" ./deploy.sh

        if [ "${TOGGLE_SMOKE}" = "true" ] && [ -n "${SMOKE_TEST_URL}" ]; then
          SMOKE_TEST_URL="${SMOKE_TEST_URL}" bash 6_deploy/scripts/smoke_test.sh
        fi
