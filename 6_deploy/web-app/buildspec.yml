# CodeBuild buildspec for the SPBC web-app container image.
#
# Replaces the inline `docker login/build/push` that used to run on the GitHub Actions runner,
# so the deploy pipeline needs no local Docker. Driven by build_webapp_image.sh, which uploads
# this directory (with the generated *-config.json files present) as the S3 source and starts
# the build. The build context is the source root — the zipped contents of 6_deploy/web-app —
# so the Dockerfile is ./Dockerfile and this file is referenced as the bare name buildspec.yml.
#
# Expected environment (all passed as start-build overrides by build_webapp_image.sh):
#   AWS_REGION          region of the ECR registry
#   ECR_REPOSITORY_URL  <acct>.dkr.ecr.<region>.amazonaws.com/pastrycafe-prod
#   IMAGE_TAG           immutable per-build tag (12-char git SHA)
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Validating required environment variables"
      - test -n "$ECR_REPOSITORY_URL" || { echo "ECR_REPOSITORY_URL is not set"; exit 1; }
      - test -n "$IMAGE_TAG" || { echo "IMAGE_TAG is not set"; exit 1; }
      - test -n "$AWS_REGION" || { echo "AWS_REGION is not set"; exit 1; }
      - echo "Logging in to ECR registry ${ECR_REPOSITORY_URL%%/*}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
  build:
    commands:
      - echo "Building ${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
      - docker build --platform linux/amd64 -t "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" .
  post_build:
    commands:
      - echo "Pushing ${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
      - docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
      - echo "Pushed ${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
