  <circle cx="254" cy="200" r="3" fill="#9ca3af"/>
  <rect x="236" y="108" width="36" height="6" rx="3" fill="#dbeafe"/>
  <rect x="236" y="120" width="28" height="6" rx="3" fill="#bfdbfe"/>
