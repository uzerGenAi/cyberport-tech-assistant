  </defs>
  <rect width="320" height="240" rx="18" fill="url(#bg)"/>
  <!-- laptop -->
  <rect x="44" y="58" width="176" height="112" rx="8" fill="#374151"/>
  <rect x="52" y="66" width="160" height="96" rx="4" fill="url(#screen)"/>
