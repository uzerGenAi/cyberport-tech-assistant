  <rect x="64" y="108" width="92" height="6" rx="3" fill="#fca5a5" opacity="0.8"/>
  <rect x="64" y="128" width="46" height="18" rx="9" fill="#ffffff"/>
  <path d="M28 172 h208 l-10 14 h-188 z" fill="#4b5563"/>
  <rect x="114" y="172" width="36" height="5" rx="2" fill="#6b7280"/>
  <!-- phone -->
  <rect x="222" y="86" width="64" height="120" rx="12" fill="#e5e7eb"/>
