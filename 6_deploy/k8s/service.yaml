# Production Service for the web app. One colour is live at a time; deploy_blue_green.sh moves
# the `version` selector between blue and green, and rollback.sh moves it back.
#
# Applied only when the Service does not yet exist: re-applying this file would reset the
# selector to blue and could point production at the idle colour.
#
# This replaces the former deployment.yaml, which defined a Service whose selector
# (app: spbc-bakery-web) did not match the pods the deploy script creates (app: spbc-bakery),
# alongside a Deployment that could not be applied because its image was REPLACE_ME_IMAGE.
# The per-colour Deployments are generated by deploy_blue_green.sh.
apiVersion: v1
kind: Service
metadata:
  name: spbc-bakery-web-svc
  namespace: spbc-bakery
  labels:
    app: spbc-bakery
spec:
  type: LoadBalancer
  selector:
    app: spbc-bakery
    version: blue
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
